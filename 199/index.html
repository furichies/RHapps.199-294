<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RH199 - RHCSA Rapid Track - Red Hat Certified System Administrator - Guía interactiva del estudiante">
  <title>RH199 | RHCSA Rapid Track</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23EE0000' rx='20' width='100' height='100'/><text x='50' y='68' text-anchor='middle' fill='white' font-size='48' font-weight='bold' font-family='sans-serif'>R</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-logo">
      <button class="btn-icon sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <svg viewBox="0 0 36 36" fill="none">
        <rect width="36" height="36" rx="8" fill="#EE0000"/>
        <path d="M10 18l4 4 8-10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <div class="header-logo-text"><span>RH199</span> RHCSA</div>
        <div class="header-course">Red Hat Certified System Administrator - Rapid Track</div>
      </div>
    </div>

    <div class="header-actions">
      <div class="header-search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Buscar contenido... (Ctrl+K)" autocomplete="off">
      </div>
      <button class="btn-icon" id="themeToggle" aria-label="Cambiar tema">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/></svg>
      </button>
    </div>
  </header>

  <!-- LAYOUT -->
  <div class="app-layout">
    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-section-title">Contenido del curso</div>
      <div id="chapterList"></div>
    </nav>

    <!-- MAIN -->
    <main class="main-content" id="mainContent">
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/></svg>
        </div>
        <h1>RH199 Student Guide</h1>
        <p>RHCSA Rapid Track - Red Hat Enterprise Linux 10.0</p>
        <p style="font-size: 0.9rem; color: var(--text-muted);">Selecciona un capítulo en el panel lateral para comenzar</p>
        <div class="welcome-stats" id="welcomeStats">
          <!-- Stats will be populated dynamically from structure.json -->
        </div>
      </div>

      <div class="content-view" id="contentView" style="display:none;"></div>
    </main>
  </div>

  <!-- SEARCH OVERLAY -->
  <div class="search-overlay" id="searchOverlay"></div>
  <div class="search-results" id="searchResults"></div>

  <!-- BACK TO TOP -->
  <button class="back-to-top" id="backToTop" aria-label="Volver arriba">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 15l-6-6-6 6"/></svg>
  </button>

  <script src="js/app.js"></script>
</body>
</html>
